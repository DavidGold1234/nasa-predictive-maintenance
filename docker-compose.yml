services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
    ports:
      - "2181:2181"
    mem_limit: 256m
    cpus: 0.50

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    mem_limit: 768m
    cpus: 1.00

  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    environment:
      - CLUSTER_NAME=test
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
    ports:
      - "9870:9870"
      - "9000:9000"
    volumes:
      - namenode_data:/hadoop/dfs/name
      - ./data:/data
    mem_limit: 1g
    cpus: 1.00

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    depends_on:
      - namenode
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://namenode:9000
      - SERVICE_PRECONDITION=namenode:9870
    ports:
      - "9864:9864"
    volumes:
      - datanode_data:/hadoop/dfs/data
      - ./data:/data
    mem_limit: 1500m
    cpus: 1.00

  spark-master:
    build:
      context: .
      dockerfile: infrastructure/spark/Dockerfile
    container_name: spark-master
    runtime: nvidia
    environment:
      SPARK_USER: root
      HADOOP_USER_NAME: root
      USER: root
      HOME: /tmp
      IVY_HOME: /tmp/.ivy2
      SPARK_LOCAL_DIRS: /tmp/spark-temp
      NVIDIA_VISIBLE_DEVICES: all
      SPARK_DAEMON_MEMORY: 512m
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.master.Master
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/data
      - ./apps:/apps
      - ./src:/src
      - ./outputs:/outputs
    mem_limit: 1g
    cpus: 1.50

  spark-worker:
    build:
      context: .
      dockerfile: infrastructure/spark/Dockerfile
    container_name: spark-worker
    runtime: nvidia
    environment:
      SPARK_USER: root
      HADOOP_USER_NAME: root
      USER: root
      HOME: /tmp
      IVY_HOME: /tmp/.ivy2
      SPARK_LOCAL_DIRS: /tmp/spark-temp
      NVIDIA_VISIBLE_DEVICES: all
      SPARK_WORKER_MEMORY: 6g
      SPARK_WORKER_CORES: 6
      SPARK_DAEMON_MEMORY: 512m
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
    depends_on:
      - spark-master
    command: /opt/spark/bin/spark-class org.apache.spark.deploy.worker.Worker spark://spark-master:7077
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
      - ./apps:/apps
      - ./src:/src
      - ./outputs:/outputs
    mem_limit: 8g
    cpus: 6.00

  jupyter:
    build:
      context: .
      dockerfile: infrastructure/jupyter/Dockerfile
    container_name: jupyter
    depends_on:
      - spark-master
      - namenode
    ports:
      - "8888:8888"
    environment:
      SPARK_MASTER: spark://spark-master:7077
      JAVA_HOME: /usr/lib/jvm/java-11-openjdk-amd64
      SPARK_HOME: /opt/spark
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      PYSPARK_SUBMIT_ARGS: >-
        --master spark://spark-master:7077
        --conf spark.hadoop.fs.defaultFS=hdfs://namenode:9000
        pyspark-shell
    volumes:
      - ./data:/home/jovyan/work/data
      - ./apps:/home/jovyan/work/apps
      - ./src:/home/jovyan/work/src
      - ./outputs:/home/jovyan/work/outputs
      - ./notebooks:/home/jovyan/work/notebooks
    mem_limit: 1g
    cpus: 1.00

  ros-gazebo:
    build:
      context: .
      dockerfile: infrastructure/ros/Dockerfile
    container_name: ros-gazebo
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "11311:11311"
    volumes:
      - ./ros_ws:/root/ros_ws
      - ./outputs/ros_data:/outputs/ros_data
    tty: true
    stdin_open: true
    mem_limit: 512m
    cpus: 1.00

  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_DB: tesis
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 512m
    cpus: 1.00

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    depends_on:
      - postgres
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin123
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    mem_limit: 256m
    cpus: 0.50

volumes:
  namenode_data:
  datanode_data:
  postgres_data:
  grafana_data: