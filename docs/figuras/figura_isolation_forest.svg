<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="Principio de aislamiento estadistico de Isolation Forest: un punto normal, ubicado dentro de un grupo denso de observaciones, requiere varios cortes aleatorios del espacio para quedar aislado, mientras que un punto anomalo, alejado del grupo, queda aislado con muy pocos cortes; una longitud de camino promedio menor equivale a un score de anomalia mayor.">
  <style>
    .bg { fill: #ffffff; }
    .frame { fill: none; stroke: #c7c8c2; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .lbl-title { font: 600 13px "Consolas","Courier New",monospace; fill: #1b1d22; }
    .lbl-sub { font: 11px "Consolas","Courier New",monospace; fill: #61646d; }
    .lbl-zone { font: 600 11px "Consolas","Courier New",monospace; letter-spacing: 1px; fill: #61646d; }
    .dot { fill: #61646d; }
    .dot-target { fill: #4f7a59; stroke: #4f7a59; }
    .dot-outlier { fill: #b6564f; stroke: #b6564f; }
    .cut { stroke: #9a9c95; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
    .cut-outlier { stroke: #b6564f; stroke-width: 1.3; stroke-dasharray: 4 3; fill: none; }
  </style>

  <rect class="bg" x="0" y="0" width="900" height="420"></rect>

  <rect x="30" y="50" width="400" height="300" rx="8" class="frame"></rect>
  <text x="230" y="34" text-anchor="middle" class="lbl-zone">PUNTO NORMAL (DENTRO DEL GRUPO)</text>

  <!-- cluster dots, left panel -->
  <circle class="dot" cx="140" cy="140" r="5"></circle>
  <circle class="dot" cx="175" cy="110" r="5"></circle>
  <circle class="dot" cx="200" cy="150" r="5"></circle>
  <circle class="dot" cx="150" cy="190" r="5"></circle>
  <circle class="dot" cx="185" cy="220" r="5"></circle>
  <circle class="dot" cx="230" cy="240" r="5"></circle>
  <circle class="dot" cx="260" cy="200" r="5"></circle>
  <circle class="dot" cx="280" cy="150" r="5"></circle>
  <circle class="dot" cx="250" cy="120" r="5"></circle>
  <circle class="dot" cx="300" cy="190" r="5"></circle>
  <circle class="dot" cx="310" cy="240" r="5"></circle>
  <circle class="dot" cx="160" cy="260" r="5"></circle>
  <circle class="dot" cx="220" cy="270" r="5"></circle>
  <circle class="dot-target" cx="225" cy="185" r="6"></circle>

  <!-- 4 nested cuts around the target -->
  <line x1="60" y1="90" x2="410" y2="90" class="cut"></line>
  <line x1="60" y1="90" x2="60" y2="330" class="cut"></line>
  <line x1="140" y1="90" x2="140" y2="330" class="cut"></line>
  <line x1="140" y1="205" x2="410" y2="205" class="cut"></line>
  <line x1="245" y1="90" x2="245" y2="205" class="cut"></line>
  <line x1="140" y1="150" x2="245" y2="150" class="cut"></line>

  <text x="230" y="316" text-anchor="middle" class="lbl-sub">4 cortes o mas para aislarlo</text>

  <rect x="470" y="50" width="400" height="300" rx="8" class="frame"></rect>
  <text x="670" y="34" text-anchor="middle" class="lbl-zone">PUNTO ANOMALO (ALEJADO DEL GRUPO)</text>

  <!-- cluster dots, right panel (shifted toward lower-left of the frame) -->
  <circle class="dot" cx="560" cy="230" r="5"></circle>
  <circle class="dot" cx="595" cy="200" r="5"></circle>
  <circle class="dot" cx="620" cy="240" r="5"></circle>
  <circle class="dot" cx="570" cy="280" r="5"></circle>
  <circle class="dot" cx="605" cy="300" r="5"></circle>
  <circle class="dot" cx="650" cy="290" r="5"></circle>
  <circle class="dot" cx="680" cy="250" r="5"></circle>
  <circle class="dot" cx="700" cy="210" r="5"></circle>
  <circle class="dot" cx="670" cy="190" r="5"></circle>
  <circle class="dot" cx="720" cy="270" r="5"></circle>
  <circle class="dot" cx="580" cy="320" r="5"></circle>
  <circle class="dot" cx="640" cy="320" r="5"></circle>
  <circle class="dot-outlier" cx="840" cy="80" r="6"></circle>

  <!-- 2 cuts isolating the outlier corner -->
  <line x1="780" y1="60" x2="780" y2="340" class="cut-outlier"></line>
  <line x1="780" y1="120" x2="870" y2="120" class="cut-outlier"></line>

  <text x="670" y="316" text-anchor="middle" class="lbl-sub">2 cortes bastan para aislarlo</text>

  <text x="450" y="392" text-anchor="middle" class="lbl-title">longitud de camino promedio menor -&gt; score de anomalia mayor</text>
</svg>
