<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-label="Principio de deteccion de anomalias por reconstruccion: una entrada atraviesa un encoder hacia un espacio latente comprimido y un decoder la reconstruye; el error entre la entrada y la reconstruccion es bajo para una ventana sana y alto para una ventana anomala, disparando la alerta.">
  <style>
    .bg { fill: #ffffff; }
    .box { fill: #ffffff; stroke: #9a9c95; stroke-width: 1.4; }
    .box-latent { fill: #eaeae6; stroke: #9a9c95; stroke-width: 1.4; }
    .box-sano { fill: #ffffff; stroke: #6b9e78; stroke-width: 1.6; }
    .box-anom { fill: #ffffff; stroke: #b6564f; stroke-width: 1.6; }
    .lbl-title { font: 600 13px "Consolas","Courier New",monospace; fill: #1b1d22; }
    .lbl-sub { font: 11px "Consolas","Courier New",monospace; fill: #61646d; }
    .lbl-edge { font: 11px "Consolas","Courier New",monospace; fill: #61646d; }
    .lbl-zone { font: 600 11px "Consolas","Courier New",monospace; letter-spacing: 1px; fill: #61646d; }
    .lbl-sano { font: 600 11px "Consolas","Courier New",monospace; fill: #4f7a59; }
    .lbl-anom { font: 600 11px "Consolas","Courier New",monospace; fill: #9c433d; }
    .edge { stroke: #9a9c95; stroke-width: 1.4; fill: none; }
    .edge-sano { stroke: #6b9e78; stroke-width: 1.6; fill: none; }
    .edge-anom { stroke: #b6564f; stroke-width: 1.6; fill: none; }
    .frame { fill: none; stroke: #c7c8c2; stroke-width: 1.2; stroke-dasharray: 5 4; }
  </style>
  <defs>
    <marker id="arrowR" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9a9c95"></path>
    </marker>
    <marker id="arrowSano" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b9e78"></path>
    </marker>
    <marker id="arrowAnom" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#b6564f"></path>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="900" height="340"></rect>
  <rect x="14" y="14" width="872" height="200" rx="10" class="frame"></rect>
  <text x="30" y="34" class="lbl-zone">ENTRENAMIENTO SOBRE CONDICION SANA</text>

  <rect x="40" y="70" width="120" height="56" rx="6" class="box"></rect>
  <text x="100" y="93" text-anchor="middle" class="lbl-title">x</text>
  <text x="100" y="110" text-anchor="middle" class="lbl-sub">ventana sana</text>

  <line x1="160" y1="98" x2="222" y2="98" class="edge" marker-end="url(#arrowR)"></line>

  <rect x="226" y="70" width="130" height="56" rx="6" class="box"></rect>
  <text x="291" y="93" text-anchor="middle" class="lbl-title">Encoder</text>
  <text x="291" y="110" text-anchor="middle" class="lbl-sub">comprime</text>

  <line x1="356" y1="98" x2="418" y2="98" class="edge" marker-end="url(#arrowR)"></line>

  <rect x="422" y="76" width="100" height="44" rx="6" class="box-latent"></rect>
  <text x="472" y="103" text-anchor="middle" class="lbl-title">z</text>

  <line x1="522" y1="98" x2="584" y2="98" class="edge" marker-end="url(#arrowR)"></line>

  <rect x="588" y="70" width="130" height="56" rx="6" class="box"></rect>
  <text x="653" y="93" text-anchor="middle" class="lbl-title">Decoder</text>
  <text x="653" y="110" text-anchor="middle" class="lbl-sub">reconstruye</text>

  <line x1="718" y1="98" x2="780" y2="98" class="edge" marker-end="url(#arrowR)"></line>

  <rect x="784" y="70" width="90" height="56" rx="6" class="box"></rect>
  <text x="829" y="93" text-anchor="middle" class="lbl-title">x'</text>
  <text x="829" y="110" text-anchor="middle" class="lbl-sub">salida</text>

  <text x="472" y="60" text-anchor="middle" class="lbl-sub">espacio latente (cuello de botella)</text>

  <line x1="100" y1="126" x2="100" y2="180" class="edge" stroke-dasharray="3 3"></line>
  <line x1="829" y1="126" x2="829" y2="180" class="edge" stroke-dasharray="3 3"></line>
  <line x1="100" y1="180" x2="829" y2="180" class="edge" stroke-dasharray="3 3"></line>
  <text x="464" y="196" text-anchor="middle" class="lbl-sub">error de reconstruccion = || x − x' ||</text>

  <rect x="60" y="240" width="360" height="80" rx="8" class="box-sano"></rect>
  <text x="240" y="264" text-anchor="middle" class="lbl-sano">EVALUACION: VENTANA SANA</text>
  <text x="240" y="284" text-anchor="middle" class="lbl-sub">x se parece a lo aprendido</text>
  <text x="240" y="300" text-anchor="middle" class="lbl-sub">error bajo -&gt; estado normal</text>

  <rect x="480" y="240" width="360" height="80" rx="8" class="box-anom"></rect>
  <text x="660" y="264" text-anchor="middle" class="lbl-anom">EVALUACION: VENTANA ANOMALA</text>
  <text x="660" y="284" text-anchor="middle" class="lbl-sub">x se aparta de lo aprendido</text>
  <text x="660" y="300" text-anchor="middle" class="lbl-sub">error crece -&gt; alerta</text>
</svg>
