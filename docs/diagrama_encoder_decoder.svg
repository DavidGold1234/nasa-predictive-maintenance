<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" font-family="Arial, Helvetica, sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>

  <!-- Title -->
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="bold" fill="#1e293b">
    Transferencia de aprendizaje: encoder congelado, decoder adaptado
  </text>

  <!-- Input -->
  <text x="90" y="215" text-anchor="middle" font-size="14" fill="#334155">Ventana ROS</text>
  <text x="90" y="232" text-anchor="middle" font-size="14" fill="#334155">(30 ciclos)</text>
  <rect x="20" y="180" width="140" height="60" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="90" y="215" text-anchor="middle" font-size="13" fill="#334155">Ventana ROS</text>
  <text x="90" y="232" text-anchor="middle" font-size="13" fill="#334155">(30 ciclos)</text>

  <!-- Arrow input -> encoder -->
  <line x1="160" y1="210" x2="215" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Encoder block (frozen) -->
  <rect x="220" y="130" width="180" height="160" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <text x="310" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#1d4ed8">Encoder</text>
  <text x="310" y="180" text-anchor="middle" font-size="12" fill="#1d4ed8">(+ proyección latente)</text>

  <!-- Lock icon -->
  <g transform="translate(292,196)">
    <rect x="0" y="10" width="36" height="26" rx="4" fill="#1d4ed8"/>
    <path d="M 6 10 V 0 a 12 12 0 0 1 24 0 V 10" fill="none" stroke="#1d4ed8" stroke-width="4"/>
    <circle cx="18" cy="24" r="3.5" fill="#eff6ff"/>
  </g>

  <text x="310" y="255" text-anchor="middle" font-size="13" font-weight="bold" fill="#1d4ed8">CONGELADO</text>
  <text x="310" y="272" text-anchor="middle" font-size="11" fill="#1e40af">pesos NASA, sin cambios</text>

  <!-- Arrow encoder -> latent -->
  <line x1="400" y1="210" x2="450" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Latent space -->
  <rect x="455" y="185" width="70" height="50" rx="25" fill="#f8fafc" stroke="#64748b" stroke-width="2"/>
  <text x="490" y="206" text-anchor="middle" font-size="11" fill="#475569">espacio</text>
  <text x="490" y="220" text-anchor="middle" font-size="11" fill="#475569">latente</text>

  <!-- Arrow latent -> decoder -->
  <line x1="525" y1="210" x2="575" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Decoder block (adapted) -->
  <rect x="580" y="130" width="190" height="160" rx="10" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <text x="675" y="160" text-anchor="middle" font-size="16" font-weight="bold" fill="#c2410c">Decoder</text>

  <!-- Pencil / edit icon -->
  <g transform="translate(658,178)">
    <rect x="0" y="18" width="30" height="8" fill="#c2410c" transform="rotate(-40 15 22)"/>
    <polygon points="0,32 6,32 2,40" fill="#c2410c" transform="rotate(-40 15 22) translate(-2,10)"/>
  </g>

  <text x="675" y="248" text-anchor="middle" font-size="13" font-weight="bold" fill="#c2410c">SE REENTRENA</text>
  <text x="675" y="265" text-anchor="middle" font-size="11" fill="#9a3412">datos ROS, tasa de</text>
  <text x="675" y="279" text-anchor="middle" font-size="11" fill="#9a3412">aprendizaje 10x menor</text>

  <!-- Arrow decoder -> output -->
  <line x1="770" y1="210" x2="825" y2="210" stroke="#334155" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="862" y="205" text-anchor="middle" font-size="13" fill="#334155">Recons-</text>
  <text x="862" y="220" text-anchor="middle" font-size="13" fill="#334155">trucción</text>

  <!-- Bottom caption -->
  <text x="450" y="345" text-anchor="middle" font-size="13" fill="#475569">
    El encoder ya sabe reconocer el patrón general de degradación (aprendido en NASA) — no se toca.
  </text>
  <text x="450" y="365" text-anchor="middle" font-size="13" fill="#475569">
    Solo el decoder se ajusta para reconstruir las magnitudes específicas de los sensores ROS.
  </text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#334155"/>
    </marker>
  </defs>
</svg>
